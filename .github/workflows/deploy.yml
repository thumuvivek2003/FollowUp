name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to the `gh-pages` branch, which
# GitHub Pages serves. No Pages API setup is needed for this to run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Only one deployment at a time; a newer push cancels an older in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Pinned so the ubuntu-latest → Ubuntu 26 migration can't change the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish dist/ to gh-pages branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
